<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gem Isle · start.ng</title>
  <meta name="description" content="Gem Isle: run around a floating island as your start.ng character, grab gems, dodge the boulders and slimes, and climb the leaderboard.">
  <meta name="theme-color" content="#9fd6f5">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Gem Isle"></canvas>
  <div id="flash" aria-hidden="true"></div>

  <!-- the start.ng player: face, character name and account -->
  <div class="startng-card" id="player-card" hidden>
    <img id="player-face" alt="" hidden>
    <div class="who">
      <b id="player-name">Guest</b>
      <span id="player-account">Not signed in</span>
    </div>
    <button id="player-sign-in" type="button" hidden>Sign in</button>
  </div>

  <div class="hud" id="hud" hidden>
    <div class="stat hearts" id="hearts" aria-label="Lives"><i></i><i></i><i></i></div>
    <div class="stat"><span class="gem-icon"></span><b id="gem-count">0</b></div>
    <div class="stat"><b id="timer">0:00</b></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <!-- touch controls -->
  <div id="joystick" hidden><div class="knob"></div></div>
  <button id="jump-btn" type="button" hidden aria-label="Jump">JUMP</button>

  <div class="overlay" id="overlay">
    <div class="panel">
      <a class="brand" href="https://start.ng" rel="noopener">start<span>.ng</span></a>
      <h1 id="title">Gem Isle</h1>
      <p id="message">Grab gems. Dodge the boulders. Outrun the slimes.</p>
      <div class="result" id="result" hidden>
        <div><b id="r-gems">0</b><span>gems</span></div>
        <div><b id="r-time">0:00</b><span>survived</span></div>
      </div>
      <p class="note" id="note" hidden></p>
      <div class="buttons">
        <button id="action" type="button">Play</button>
        <button id="board-btn" type="button" class="secondary">Leaderboard</button>
      </div>
      <ol id="board" hidden></ol>
      <p class="hint" id="hint"><b>WASD</b> / arrows to run · <b>Space</b> to jump · 5 gems in a row heals a heart</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
